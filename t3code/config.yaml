name: T3 Code
version: "0.2.1"
slug: t3code
description: Run T3 Code in headless server mode with Server-side Cursor against Home Assistant /config
url: https://github.com/wiggo-dev/ha-t3code/tree/main/t3code
arch:
  - aarch64
  - amd64
startup: application
init: false
boot: auto
homeassistant: 0.92.0b2
host_network: true
ports:
  3773/tcp: 3773
ports_description:
  3773/tcp: T3 Code headless server (HTTP/WebSocket)
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  host: 0.0.0.0
  port: 3773
  advertise_host: ""
  cursor_api_key: ""
schema:
  host: str
  port: port
  advertise_host: str?
  cursor_api_key: password?
